name: Manuscript task
description: A section to draft, a figure to make, an analysis to run, or a claim to verify.
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
      description: Describe the task and why it matters for the paper.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Files involved
      description: Which files or folders this touches (for example `manuscript/results.qmd`, `figures/fig2_pass_rates/`).
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria.
